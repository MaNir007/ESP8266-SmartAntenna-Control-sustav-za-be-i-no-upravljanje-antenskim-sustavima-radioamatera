<!-- ---------------------------------------------------------------------------
  data_graf.html - Vizualizacija senzorskih podataka
  ---------------------------------------------------------------------------
  Prikazuje grafikone temperature i vlage u stvarnom vremenu te povijesne
  podatke pohranjene na uređaju pomoću Chart.js biblioteke.
  --------------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAntenna Control - Grafovi</title>
    <link rel="stylesheet" href="common.css"> 
    <link rel="stylesheet" href="data_graf.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="icon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i>Graf temperature i vlage</h1>
            <p class="current-time">Status veze: <span id="connectionStatus" class="status-connecting"><i class="fas fa-circle-notch fa-spin"></i> Povezivanje...</span></p>
        </header>

        <main>
            <section class="cards">
            <div class="card">
                <h3>Temperatura</h3>
                <p id="temp-val">-- °C</p>
            </div>
            <div class="card">
                <h3>Vlaga</h3>
                <p id="hum-val">-- %</p>
            </div>
            </section>

        <section class="chart-wrapper">
            <canvas id="sensorChart"></canvas>
        </section>
        </main>

        <footer>
            <div class="footer-content">
                <div class="footer-links">
                    <a href="index.html"><i class="fas fa-home"></i> Početna</a>
                    <a href="logger.html"><i class="fas fa-book"></i> Logger</a>
                    <a href="data_graf.html"><i class="fas fa-chart-bar"></i> Graf</a>
                    <a href="mailto:supljikamarin1@gmail.com"><i class="fas fa-envelope"></i> Kontakt</a>
                    <a href="https://www.qrz.com/db/9A5AGN" target="_blank"><i class="fas fa-broadcast-tower"></i> QRZ</a>
                    <a href="https://github.com/MaNir007" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                </div>
                <p class="copyright">&copy; 2025 Radio Amater Sustav. Sva prava pridržana.</p>
                <p>Powered by <a href="http://marinsupljika.from.hr/" target="_blank">9A5AGN</a></p>
            </div>
        </footer>

    </div>

    <script src="common.js"></script>
    <script src="data_graf.js"></script>
</body>
</html>
